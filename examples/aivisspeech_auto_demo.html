<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AivisSpeech 自動音声合成デモ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .demo-section {
            margin-bottom: 30px;
        }

        .demo-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .form-control {
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        select.form-control {
            cursor: pointer;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            font-weight: 600;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .status.success {
            background: #e8f5e8;
            color: #2e7d2e;
        }

        .audio-player {
            margin: 20px 0;
            text-align: center;
        }

        .audio-player audio {
            width: 100%;
            max-width: 500px;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .samples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .category-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }

        .category-icon {
            font-size: 24px;
        }

        .category-title {
            font-size: 18px;
            font-weight: 600;
            color: #495057;
        }

        .sample-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sample-btn {
            padding: 15px 18px;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
        }

        .sample-btn:hover {
            border-color: #667eea;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .sample-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.3);
        }

        .sample-btn.playing {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border-color: #28a745;
        }

        .sample-btn.playing::after {
            content: '🎵';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.2); }
            100% { transform: translateY(-50%) scale(1); }
        }

        .sample-text {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .sample-meta {
            font-size: 12px;
            opacity: 0.7;
            font-style: italic;
        }

        .quick-controls {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .controls-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 120px;
        }

        .control-label {
            font-size: 13px;
            font-weight: 600;
            color: #1976d2;
        }

        .auto-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #e1e5e9;
        }

        .auto-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .auto-toggle label {
            font-weight: 600;
            color: #495057;
            margin: 0;
        }

        .stats-bar {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #e9ecef;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .content {
                padding: 20px;
            }
            
            .samples-grid {
                grid-template-columns: 1fr;
            }
            
            .demo-controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 AivisSpeech 自動デモ</h1>
            <p>サンプル文章をクリックするだけで即座に音声合成・再生</p>
        </div>

        <div class="content">
            <!-- クイックコントロール -->
            <div class="quick-controls">
                <div class="controls-row">
                    <div class="control-group">
                        <label class="control-label">話者選択</label>
                        <select id="speaker-select" class="form-control">
                            <option value="">話者を読み込み中...</option>
                        </select>
                    </div>
                    
                    <div class="auto-toggle">
                        <input type="checkbox" id="auto-play" checked>
                        <label for="auto-play">選択時に自動再生</label>
                    </div>
                    
                    <button id="test-connection" class="btn btn-secondary">
                        🔧 API接続テスト
                    </button>
                    
                    <button id="random-sample" class="btn btn-primary">
                        🎲 ランダム再生
                    </button>
                </div>
            </div>

            <!-- ステータス表示 -->
            <div id="status" class="status" style="display: none;"></div>

            <!-- 統計バー -->
            <div class="stats-bar">
                <span id="stats-text">APIに接続してサンプル音声をお楽しみください</span>
            </div>

            <!-- 音声プレーヤー -->
            <div class="audio-player" id="audio-player" style="display: none;">
                <audio controls id="audio-element"></audio>
            </div>

            <!-- サンプル文章グリッド -->
            <div class="samples-grid" id="samples-grid">
                <!-- サンプルカテゴリがここに動的に生成されます -->
            </div>
        </div>
    </div>

    <script>
        const API = 'http://127.0.0.1:10101';
        
        // UI要素の取得
        const speakerSelect = document.getElementById('speaker-select');
        const autoPlayToggle = document.getElementById('auto-play');
        const testConnectionBtn = document.getElementById('test-connection');
        const randomSampleBtn = document.getElementById('random-sample');
        const status = document.getElementById('status');
        const audioPlayer = document.getElementById('audio-player');
        const audioElement = document.getElementById('audio-element');
        const samplesGrid = document.getElementById('samples-grid');
        const statsText = document.getElementById('stats-text');

        // グローバル変数
        let speakers = [];
        let currentAudioBlob = null;
        let isPlaying = false;
        let playHistory = [];

        // 組み込みサンプル文章データ
        const sampleTexts = {
            "version": "1.0",
            "description": "AivisSpeech 自動音声合成デモ用サンプル文章",
            "categories": [
                {
                    "name": "挨拶・日常会話",

                    "samples": [

                        },
                        {

                            "situation": "昼間の挨拶",

                        },
                        {
                            "text": "お疲れ様でした。また明日もよろしくお願いします。",
                            "situation": "帰宅時の挨拶",
                            "emotion": "丁寧"
                        },
                        {
                            "text": "久しぶりですね！元気にしていましたか？",
                            "situation": "再会の挨拶",
                            "emotion": "嬉しい"
                        }
                    ]
                },
                {
                    "name": "感情表現",
                    "icon": "😊",
                    "samples": [
                        {
                            "text": "やったー！ついに成功しました！本当に嬉しいです！",
                            "situation": "成功の喜び",
                            "emotion": "大喜び"
                        },
                        {
                            "text": "ありがとうございます。心から感謝しています。",
                            "situation": "感謝の表現",
                            "emotion": "感謝"
                        },
                        {
                            "text": "申し訳ございませんでした。深くお詫び申し上げます。",
                            "situation": "謝罪",
                            "emotion": "申し訳ない"
                        },
                        {
                            "text": "えー！そんなことがあったんですか？信じられません！",
                            "situation": "驚きの表現",
                            "emotion": "驚き"
                        },
                        {
                            "text": "ちょっと待ってください。それは納得できません。",
                            "situation": "不満の表現",
                            "emotion": "不満"
                        },
                        {
                            "text": "残念ながら、今回はうまくいきませんでした。",
                            "situation": "失望",
                            "emotion": "悲しみ"
                        }
                    ]
                },
                {
                    "name": "ビジネス・丁寧語",
                    "icon": "💼",
                    "samples": [
                        {
                            "text": "いつもお世話になっております。本日はお忙しい中、お時間をいただきありがとうございます。",
                            "situation": "会議の開始",
                            "emotion": "丁寧・フォーマル"
                        },
                        {
                            "text": "恐れ入りますが、資料の確認をお願いできますでしょうか。",
                            "situation": "依頼",
                            "emotion": "丁寧"
                        },
                        {
                            "text": "承知いたしました。すぐに対応させていただきます。",
                            "situation": "承諾",
                            "emotion": "丁寧・積極的"
                        },
                        {
                            "text": "申し上げにくいのですが、スケジュールの変更をお願いしたく存じます。",
                            "situation": "変更依頼",
                            "emotion": "恐縮"
                        }
                    ]
                },
                {
                    "name": "疑問文・質問",
                    "icon": "❓",
                    "samples": [
                        {
                            "text": "今何時ですか？",
                            "situation": "時間の質問",
                            "emotion": "普通"
                        },
                        {
                            "text": "この機能はどのように使うのでしょうか？",
                            "situation": "使い方の質問",
                            "emotion": "困惑"
                        },
                        {
                            "text": "本当にそれで大丈夫ですか？",
                            "situation": "確認の質問",
                            "emotion": "心配"
                        },
                        {
                            "text": "なぜそんなことが起こったのでしょう？",
                            "situation": "原因の質問",
                            "emotion": "疑問"
                        }
                    ]
                },
                {
                    "name": "ナレーション・説明",
                    "icon": "📖",
                    "samples": [
                        {
                            "text": "音声合成技術は近年大きく進歩し、より自然で表現豊かな合成音声が実現されています。",
                            "situation": "技術説明",
                            "emotion": "解説・中性"
                        },
                        {
                            "text": "次に、設定画面を開いて、音量を調整してください。",
                            "situation": "操作説明",
                            "emotion": "指示・親切"
                        },
                        {
                            "text": "昔々、ある所にお爺さんとお婆さんが住んでいました。",
                            "situation": "物語の始まり",
                            "emotion": "語りかけ"
                        }
                    ]
                },
                {
                    "name": "数字・記号・英語混じり",
                    "icon": "🔢",
                    "samples": [
                        {
                            "text": "今日の気温は25.5度、湿度は60%です。",
                            "situation": "数値の読み上げ",
                            "emotion": "情報提供"
                        },
                        {
                            "text": "私の電話番号は090-1234-5678です。",
                            "situation": "電話番号",
                            "emotion": "事務的"
                        },
                        {
                            "text": "価格は1,980円（税込み）となっております。",
                            "situation": "価格案内",
                            "emotion": "案内"
                        }
                    ]
                },
                {
                    "name": "特殊なイントネーション",
                    "icon": "🎭",
                    "samples": [
                        {
                            "text": "えーっと、あの、すみません…",
                            "situation": "ためらい",
                            "emotion": "困惑・遠慮"
                        },
                        {
                            "text": "はい、はい、分かりました！",
                            "situation": "理解・同意",
                            "emotion": "積極的"
                        },
                        {
                            "text": "んー、どうしましょうかねー。",
                            "situation": "考え中",
                            "emotion": "迷い"
                        },
                        {
                            "text": "あー、そういうことでしたか。なるほどー。",
                            "situation": "納得",
                            "emotion": "理解"
                        }
                    ]
                },
                {
                    "name": "短文・単語",
                    "icon": "💬",
                    "samples": [
                        {
                            "text": "はい。",
                            "situation": "肯定の返事",
                            "emotion": "中性"
                        },
                        {
                            "text": "いいえ。",
                            "situation": "否定の返事",
                            "emotion": "中性"
                        },
                        {
                            "text": "そうですね。",
                            "situation": "同意",
                            "emotion": "穏やか"
                        },
                        {
                            "text": "おめでとう！",
                            "situation": "祝福",
                            "emotion": "嬉しい"
                        },
                        {
                            "text": "大丈夫？",
                            "situation": "心配・確認",
                            "emotion": "心配"
                        }
                    ]
                }
            ]
        };

        // ユーティリティ関数
        function showStatus(message, type = 'loading') {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function hideStatus() {
            status.style.display = 'none';
        }

        function updateStats() {
            const totalSamples = sampleTexts.categories.reduce((total, cat) => total + cat.samples.length, 0);
            const speakerCount = speakers.length;
            const playCount = playHistory.length;
            
            statsText.textContent = `${sampleTexts.categories.length}カテゴリ・${totalSamples}サンプル | ${speakerCount}人の話者 | ${playCount}回再生済み`;
        }

        // API接続テスト
        async function testConnection() {
            try {
                showStatus('API接続をテスト中...', 'loading');
                
                const response = await fetch(`${API}/version`, {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const versionData = await response.json();
                showStatus(`✅ API接続成功！ AivisSpeech Engine`, 'success');
                
                // 話者も読み込み
                await loadSpeakers();
                
                setTimeout(hideStatus, 3000);
                return true;
                
            } catch (error) {
                showStatus(`❌ API接続失敗: ${error.message}`, 'error');
                return false;
            }
        }

        // 話者一覧の読み込み
        async function loadSpeakers() {
            try {
                const response = await fetch(`${API}/speakers`, {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                speakers = await response.json();
                speakerSelect.innerHTML = '';
                
                if (!speakers || speakers.length === 0) {
                    throw new Error('話者データが空です');
                }
                
                speakers.forEach(speaker => {
                    speaker.styles.forEach(style => {
                        const option = document.createElement('option');
                        option.value = style.id;
                        option.textContent = `${speaker.name} (${style.name})`;
                        speakerSelect.appendChild(option);
                    });
                });
                
                // 最初の話者を選択
                if (speakerSelect.options.length > 0) {
                    speakerSelect.selectedIndex = 0;
                }
                
                updateStats();
                
            } catch (error) {
                console.error('話者読み込みエラー:', error);
                speakerSelect.innerHTML = '<option value="">話者読み込み失敗</option>';
            }
        }

        // 音声合成と再生
        async function synthesizeAndPlay(text, sampleBtn = null) {
            const speakerId = speakerSelect.value;
            
            if (!speakerId) {
                showStatus('話者を選択してください', 'error');
                setTimeout(hideStatus, 3000);
                return false;
            }

            if (isPlaying) {
                showStatus('他の音声を合成中です。お待ちください...', 'error');
                setTimeout(hideStatus, 2000);
                return false;
            }

            try {
                isPlaying = true;
                
                // UIの更新
                if (sampleBtn) {
                    // 他のボタンの状態をリセット
                    document.querySelectorAll('.sample-btn').forEach(btn => {
                        btn.classList.remove('active', 'playing');
                    });
                    sampleBtn.classList.add('active', 'playing');
                }
                
                showStatus('音声を合成中...', 'loading');
                
                // Audio Query作成
                const queryResponse = await fetch(
                    `${API}/audio_query?text=${encodeURIComponent(text)}&speaker=${speakerId}`, 
                    { method: 'POST', mode: 'cors' }
                );
                
                if (!queryResponse.ok) {
                    throw new Error(`クエリ作成失敗: ${queryResponse.status}`);
                }
                
                const query = await queryResponse.json();
                
                // kanaフィールドに元テキストを設定（推奨）
                query.kana = text;
                
                // 音声合成
                const synthesisResponse = await fetch(
                    `${API}/synthesis?speaker=${speakerId}&enable_interrogative_upspeak=true`, 
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'audio/wav'
                        },
                        body: JSON.stringify(query),
                        mode: 'cors'
                    }
                );
                
                if (!synthesisResponse.ok) {
                    throw new Error(`音声合成失敗: ${synthesisResponse.status}`);
                }

                currentAudioBlob = await synthesisResponse.blob();
                
                if (currentAudioBlob.size === 0) {
                    throw new Error('音声データが生成されませんでした');
                }

                // 音声再生
                const audioUrl = URL.createObjectURL(currentAudioBlob);
                audioElement.src = audioUrl;
                audioPlayer.style.display = 'block';
                
                showStatus(`🎵 音声合成完了 (${(currentAudioBlob.size / 1024).toFixed(1)}KB)`, 'success');
                
                // 自動再生が有効な場合は再生
                if (autoPlayToggle.checked) {
                    try {
                        await audioElement.play();
                        showStatus('🎧 音声再生中...', 'success');
                    } catch (playError) {
                        console.warn('Auto-play failed:', playError);
                        showStatus('音声合成完了。再生ボタンをクリックしてください。', 'success');
                    }
                }
                
                // 再生履歴に追加
                playHistory.push({
                    text: text.substring(0, 30) + (text.length > 30 ? '...' : ''),
                    timestamp: new Date().toLocaleTimeString(),
                    speaker: speakerSelect.selectedOptions[0].textContent
                });
                
                updateStats();
                setTimeout(hideStatus, 5000);
                return true;

            } catch (error) {
                console.error('音声合成エラー:', error);
                
                let errorMessage = '音声合成に失敗: ';
                if (error.message.includes('Failed to fetch')) {
                    errorMessage += 'APIサーバーとの通信に失敗';
                } else if (error.message.includes('400')) {
                    errorMessage += 'リクエストが不正です';
                } else if (error.message.includes('500')) {
                    errorMessage += 'サーバー内部エラー';
                } else {
                    errorMessage += error.message;
                }
                
                showStatus(errorMessage, 'error');
                
                if (sampleBtn) {
                    sampleBtn.classList.remove('playing');
                }
                
                return false;
                
            } finally {
                isPlaying = false;
                
                // 3秒後にplayingクラスを除去
                setTimeout(() => {
                    if (sampleBtn) {
                        sampleBtn.classList.remove('playing');
                    }
                }, 3000);
            }
        }

        // サンプルボタンの作成
        function createSampleButton(sample, categoryName) {
            const sampleBtn = document.createElement('button');
            sampleBtn.className = 'sample-btn';
            
            sampleBtn.innerHTML = `
                <div class="sample-text">${sample.text}</div>
                <div class="sample-meta">${sample.situation} | ${sample.emotion}</div>
            `;
            
            sampleBtn.addEventListener('click', async () => {
                console.log(`🎯 選択: [${categoryName}] ${sample.situation}`);
                await synthesizeAndPlay(sample.text, sampleBtn);
            });
            
            return sampleBtn;
        }

        // サンプルカテゴリの表示
        function displaySamples() {
            samplesGrid.innerHTML = '';
            
            sampleTexts.categories.forEach(category => {
                const categoryCard = document.createElement('div');
                categoryCard.className = 'category-card';
                
                categoryCard.innerHTML = `
                    <div class="category-header">
                        <div class="category-icon">${category.icon}</div>
                        <div class="category-title">${category.name}</div>
                    </div>
                    <div class="sample-list" id="samples-${category.name}"></div>
                `;
                
                const sampleList = categoryCard.querySelector('.sample-list');
                
                category.samples.forEach(sample => {
                    const sampleBtn = createSampleButton(sample, category.name);
                    sampleList.appendChild(sampleBtn);
                });
                
                samplesGrid.appendChild(categoryCard);
            });
        }

        // ランダムサンプル選択
        function selectRandomSample() {
            const allSamples = [];
            sampleTexts.categories.forEach(category => {
                category.samples.forEach(sample => {
                    allSamples.push({ sample, categoryName: category.name });
                });
            });
            
            if (allSamples.length === 0) return;
            
            const randomIndex = Math.floor(Math.random() * allSamples.length);
            const selected = allSamples[randomIndex];
            
            console.log(`🎲 ランダム選択: [${selected.categoryName}] ${selected.sample.situation}`);
            
            // 対応するボタンを探して強調表示
            const buttons = document.querySelectorAll('.sample-btn');
            let targetBtn = null;
            
            buttons.forEach(btn => {
                if (btn.querySelector('.sample-text').textContent === selected.sample.text) {
                    targetBtn = btn;
                }
            });
            
            synthesizeAndPlay(selected.sample.text, targetBtn);
        }

        // イベントリスナーの設定
        testConnectionBtn.addEventListener('click', testConnection);
        randomSampleBtn.addEventListener('click', selectRandomSample);

        // 音声再生終了時の処理
        audioElement.addEventListener('ended', () => {
            document.querySelectorAll('.sample-btn').forEach(btn => {
                btn.classList.remove('playing');
            });
        });

        // 初期化
        function initialize() {
            displaySamples();
            updateStats();
            
            // 初回API接続テスト
            setTimeout(() => {
                testConnection();
            }, 1000);
        }

        // ページ読み込み完了後に初期化
        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
